name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5",
             "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Resolve Yarn / Loader / Fabric API versions
        id: v
        run: |
          # run through bash (the exec bit can be lost in zips) and assign first so a failure stops the job
          ARGS=$(bash scripts/resolve-versions.sh '${{ matrix.mc }}')
          echo "Resolved: $ARGS"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      - name: Build
        run: gradle build ${{ steps.v.outputs.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: location-display-${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  bundle:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: location-display-all-1.21.x
          pattern: location-display-1.21*
